
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Cañizares ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.heart {
    font-size: 150px;
    color: #ff0033;
    animation: heartbeat 1s infinite;
    filter: drop-shadow(0 0 20px #ff0033)
            drop-shadow(0 0 50px #ff0033);
}

.name {
    margin-top: 45px;
    color: white;
    font-size: 35px;
    letter-spacing: 7px;
    text-align: center;
    text-shadow: 0 0 10px #ff0033,
                 0 0 25px #ff0033;
    animation: glow 2s infinite alternate;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    10% { transform: scale(1.2); }
    20% { transform: scale(1); }
    30% { transform: scale(1.2); }
    45% { transform: scale(1); }
}

@keyframes glow {
    from {
        text-shadow: 0 0 10px #ff0033;
    }
    to {
        text-shadow: 0 0 20px #ff0033,
                     0 0 40px #ff0033;
    }
}

@media(max-width: 600px) {
    .heart {
        font-size: 110px;
    }

    .name {
        font-size: 22px;
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

    <div class="heart">♥</div>

    <h1 class="name">ANGEL CAÑIZARES</h1>

</body>
</html>
